name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run dead code detection
        run: vulture src run.py manage.py verify_codes.py scripts/

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_golden_images.py --ignore=tests/test_regression.py
